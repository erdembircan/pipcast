<div id="root" style="display: flex; gap: 32px; align-items: flex-end; padding: 24px; background: var(--desktop-mock, #b9b0a6);"></div>
<script>
  var h = React.createElement;
  var P = window.PipNews;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h(P.Pip, { width: 716, sample: 'run-return', controls: true }),
    h(P.Pip, { width: 420, sample: 'run-needs-input', controls: true, transparent: 'on', hover: 'transparent' })
  ));
</script>
