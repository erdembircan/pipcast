<!-- @dsCard group="Desk" height=330 width=1100 subtitle="The engine's poses, eyes and turn frames; the last one is talking" -->
<div id="root" class="pn-surface" style="display: flex; flex-wrap: wrap; gap: 28px 32px; align-items: flex-end; padding: 28px;"></div>
<script>
  var h = React.createElement;
  var P = window.PipNews;
  var frames = [
    { pose: 'default' }, { pose: 'arms-up' }, { arms: 'one-up' }, { pose: 'look-left' }, { pose: 'look-right' },
    { eyes: 'closed' }, { eyes: 'wink' },
    { facing: 'right-12' }, { facing: 'right-30' }, { facing: 'right-55' }, { facing: 'right-75' }, { facing: 'edge' }, { facing: 'back' }
  ];
  var kids = frames.map(function (f, i) { return h(P.Clawd, Object.assign({ key: i, cell: 8 }, f)); });
  kids.push(h(P.Clawd, { key: 'talk', cell: 10, act: 'talk', animate: true }));
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null, kids));
</script>
