<!-- @dsCard group="Band" height=330 width=520 subtitle="The four states in the band's container: nothing on KLWD, room on KLWD, on air, and KLWD full; then on air in the dark theme's container" -->
<div id="root" style="display: flex; flex-direction: column; gap: 22px; padding: 28px 32px; background: var(--app-band, #f0eee6);"></div>
<script>
  var h = React.createElement;
  var P = window.PipNews;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h(P.Band, { key: 'none', onAir: 0 }),
    h(P.Band, { key: 'room', onAir: 3 }),
    h(P.Band, { key: 'on', tuned: true, onAir: 2 }),
    h(P.Band, { key: 'full', onAir: 4 }),
    h('div', { key: 'dark', style: { margin: '6px -32px -28px', padding: '22px 32px 28px', background: 'var(--app-band-dark, #212121)' } },
      h(P.Band, { tuned: true, onAir: 3 }))
  ));
</script>
