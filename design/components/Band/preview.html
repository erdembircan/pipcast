<!-- @dsCard group="Band" height=200 width=520 subtitle="Off air and on air in the band's container, the same however many sessions are on KLWD; then on air in the dark theme's container" -->
<div id="root" style="display: flex; flex-direction: column; gap: 22px; padding: 28px 32px; background: var(--app-band, #f0eee6);"></div>
<script>
  var h = React.createElement;
  var P = window.PipNews;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h(P.Band, { key: 'off' }),
    h(P.Band, { key: 'on', tuned: true }),
    h('div', { key: 'dark', style: { margin: '6px -32px -28px', padding: '22px 32px 28px', background: 'var(--app-band-dark, #212121)' } },
      h(P.Band, { tuned: true }))
  ));
</script>
