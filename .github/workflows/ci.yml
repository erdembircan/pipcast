name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build what ships
        run: bash scripts/build.sh
      - name: plugin/ holds what its sources build
        run: |
          changed="$(git status --porcelain)"
          if [ -n "$changed" ]; then
            echo "The build changed what is committed. Run scripts/build.sh and commit what it builds:"
            echo "$changed"
            exit 1
          fi
      - name: plugin/ follows the plugin directory's rules
        run: node scripts/check-directory.mjs
      - run: npx license-wizard --verify --strict
